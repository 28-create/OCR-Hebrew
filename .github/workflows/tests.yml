name: tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify bundled asset manifests
        shell: pwsh
        run: |
          python -c "import json,hashlib,pathlib; r=pathlib.Path('aleph/assets'); a=json.loads((r/'sources.json').read_text()); assert all(hashlib.sha256((r/x['file']).read_bytes()).hexdigest()==x['sha256'] for x in a)"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider --basetemp=pytest-run
